# Conda environment for TRAM (video -> SMPL) and for capture/convert_tram_to_asap.py.
# Exported from the working machine with `conda env export -n tram --no-builds` on 2026-11-09,
# then pruned of local noise (prefix line, packages built from source by TRAM's own install).
#
# Prefer TRAM's install instructions (README.md of the pinned TRAM commit, see forks.lock);
# use this file to match versions. The CUDA 11.8 torch wheels need:
#   --extra-index-url https://download.pytorch.org/whl/cu118 (already the first pip entry below).
#
# Removed, because TRAM builds them from source or from its third-party folder:
#   detectron2, droid-backends, lietorch, pytorch3d, torch-scatter.
# Added: scipy. On the working machine scipy came from the user site-packages
# (~/.local), not from the env, so a plain export missed it; the converter needs it.
name: tram
channels:
  - defaults
  - conda-forge
  - nvidia/label/cuda-11.8.0
