# Conda environment for retargeting, training, evaluation and export (ASAP / HumanoidVerse).
# Exported from the working machine with `conda env export -n hvgym --no-builds` on 2026-11-09,
# then pruned of local noise (prefix line, local editable installs).
#
#   conda env create -f setup/env_hvgym.yml
#   conda activate hvgym
#   pip install -e $ISAACGYM_ROOT/python      # Isaac Gym Preview 4, downloaded from NVIDIA (setup/ASSETS.md)
#   pip install -e $ASAP_ROOT                  # the pinned ASAP fork (setup/bootstrap.sh)
#   pip install -e $ASAP_ROOT/isaac_utils
#
# Removed: isaacgym, asap, isaac_utils (editable, installed as above) and unitree-sdk2py
# (editable, only needed by ASAP's sim2real scripts, not by this pipeline).
# smpl-sim is PHC's helper used by retargeting; it is installed from its GitHub repository.
name: hvgym
